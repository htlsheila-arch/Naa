<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Complexe La Casa Del Shei - Gestion complète</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root {
    --navy: #0f172a; --navy2: #1e293b; --orange: #f97316; --orange2: #fb923c;
    --teal: #0ea5a4; --green: #16a34a; --red: #dc2626; --blue: #3b82f6;
    --bg1: #eef2ff; --bg2: #f8fafc; --card-radius: 1.4rem;
}
* { box-sizing: border-box; font-family: 'Inter', system-ui, 'Segoe UI', Roboto, sans-serif; }
body { background: linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 55%, #fff7ed 100%); background-attachment: fixed; margin: 0; padding: 20px; color: #1e293b; }
h1, h2, h3, .stat-number { font-family: 'Poppins', 'Inter', sans-serif; }
.app-container { max-width: 1400px; margin: 0 auto; background: rgba(255,255,255,0.85); backdrop-filter: blur(10px); border-radius: 2rem; box-shadow: 0 25px 50px -20px rgba(15,23,42,0.25); overflow: hidden; border: 1px solid rgba(255,255,255,0.6); }
header { background: linear-gradient(120deg, var(--navy) 0%, #1e3a5f 60%, #0f4c5c 100%); color: white; padding: 1.1rem 2rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; box-shadow: 0 2px 12px rgba(0,0,0,0.15); }
header h1 { margin: 0; font-size: 1.5rem; font-weight: 800; letter-spacing: 0.02em; display: flex; align-items: center; gap: 0.5rem; }
.user-info { display: flex; gap: 1rem; align-items: center; font-size: 0.9rem; }
.logout-btn { background: rgba(220,38,38,0.85); border: none; padding: 0.4rem 1.1rem; border-radius: 2rem; cursor: pointer; color: white; font-weight: 600; transition: 0.2s; }
.logout-btn:hover { background: var(--red); transform: translateY(-1px); }
nav { display: flex; flex-wrap: wrap; background: rgba(248,250,252,0.9); border-bottom: 1px solid #e2e8f0; gap: 0.3rem; padding: 0.6rem 1rem; }
.nav-btn { position: relative; background: transparent; border: none; padding: 0.65rem 1.1rem; font-weight: 600; font-size: 0.92rem; cursor: pointer; color: #475569; border-radius: 1.4rem; transition: all 0.2s; }
.nav-btn:hover { background: #e2e8f0; color: var(--navy); transform: none; }
.nav-btn.active { background: linear-gradient(120deg, var(--orange) 0%, var(--orange2) 100%); color: white; box-shadow: 0 4px 12px rgba(249,115,22,0.35); }
.nav-btn-label { pointer-events: none; }
.tab-content { display: none; padding: 2rem; animation: fadeIn 0.25s ease; }
.tab-content.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1.5rem; margin-top: 1rem; }
.card { background: #ffffff; border-radius: var(--card-radius); border: 1px solid #eef2f7; padding: 1.4rem; box-shadow: 0 8px 20px -8px rgba(15,23,42,0.12); transition: transform 0.2s, box-shadow 0.2s; }
.card:hover { box-shadow: 0 14px 28px -10px rgba(15,23,42,0.18); }
.card h3 { margin-top: 0; border-left: 5px solid var(--orange); padding-left: 0.8rem; font-weight: 700; color: var(--navy); }
button, .btn { background: var(--navy); border: none; color: white; padding: 0.55rem 1.1rem; border-radius: 2rem; cursor: pointer; font-weight: 600; margin: 0.2rem; transition: all 0.18s; letter-spacing: 0.01em; }
button:hover { background: var(--orange); transform: translateY(-1px); box-shadow: 0 6px 14px -4px rgba(249,115,22,0.5); }
button:active { transform: translateY(0); }
button:disabled { background: #cbd5e1; cursor: not-allowed; transform: none; box-shadow: none; }
input, select, textarea { padding: 0.6rem 0.8rem; border-radius: 1rem; border: 1.5px solid #dbe3ee; width: 100%; margin: 0.3rem 0; font-size: 0.95rem; transition: border 0.15s; background: #fff; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--orange); }
.flex-form { display: flex; flex-direction: column; gap: 0.6rem; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #e2e8f0; }
.summary { background: linear-gradient(120deg, #fff7ed, #fef3c7); border: 1px solid #fde8b6; padding: 0.8rem 1.2rem; border-radius: 1.1rem; margin-bottom: 1rem; font-weight: 500; color: #78350f; }
.dashboard-stats { display: flex; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem; }
.stat-card { background: linear-gradient(150deg, #ffffff, #f8fafc); border: 1px solid #eef2f7; border-radius: 1.2rem; padding: 1.1rem; flex: 1; min-width: 160px; text-align: center; box-shadow: 0 6px 16px -8px rgba(15,23,42,0.12); }
.stat-number { font-size: 1.9rem; font-weight: 800; background: linear-gradient(120deg, var(--navy), #0f4c5c); -webkit-background-clip: text; background-clip: text; color: transparent; }
.print-receipt { background: var(--green); }
.print-receipt:hover { background: #15803d; }
hr { margin: 1rem 0; border: none; border-top: 1px solid #e2e8f0; }
.danger-btn { background: var(--red); }
.danger-btn:hover { background: #b91c1c; }
.badge { display:inline-block; padding: 0.2rem 0.75rem; border-radius: 1rem; font-size: 0.75rem; font-weight: 700; color:white; letter-spacing: 0.02em; }
.badge-attente { background: linear-gradient(120deg,#f59e0b,#fb923c); }
.badge-prepa { background: linear-gradient(120deg,#3b82f6,#60a5fa); }
.badge-servi { background: linear-gradient(120deg,#16a34a,#22c55e); }
.badge-libre { background: var(--green); }
.badge-occupee { background: var(--red); }
.badge-count { display:inline-flex; align-items:center; justify-content:center; min-width:1.35rem; height:1.35rem; padding:0 0.3rem; background: var(--red); color:white; border-radius:1rem; font-size:0.72rem; font-weight:800; margin-left:0.4rem; }
.nav-badge { position: relative; top: -1px; }
.room-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(180px,1fr)); gap:1rem; margin-top:1rem; }
.room-card { border-radius:1.2rem; padding:1.1rem; color:white; text-align:center; box-shadow: 0 8px 18px -8px rgba(0,0,0,0.3); transition: transform 0.15s; }
.room-card:hover { transform: translateY(-2px); }
.room-card.libre { background:linear-gradient(135deg,#22c55e,#15803d); }
.room-card.occupee { background:linear-gradient(135deg,#f87171,#b91c1c); }
.room-card .roomnum { font-size:1.7rem; font-weight:800; }
.qty-stepper { display:flex; align-items:center; gap:0.5rem; margin:0.3rem 0; }
.qty-stepper button { padding:0.2rem 0.7rem; margin:0; }
.qty-stepper span { min-width:2rem; text-align:center; font-weight:700; }
.solde-banner { background: linear-gradient(120deg, var(--navy), #1e3a5f); color:white; border-radius:1.4rem; padding:1.4rem; text-align:center; margin-bottom:1rem; box-shadow: 0 10px 25px -10px rgba(15,23,42,0.5); }
.solde-banner .montant { font-size:2.3rem; font-weight:800; color: var(--orange2); }
#reader { width:100%; max-width:400px; margin:0.5rem 0; border-radius: 1rem; overflow: hidden; }
.tableSelectorGrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(100px,1fr)); gap:0.6rem; }
.tableSelectorGrid button { background: linear-gradient(120deg, var(--orange), var(--orange2)); }

/* --- Toasts / notifications --- */
#toastContainer { position: fixed; top: 1rem; right: 1rem; z-index: 9999; display: flex; flex-direction: column; gap: 0.6rem; max-width: 320px; }
.toast { background: var(--navy); color: white; padding: 0.9rem 1.1rem; border-radius: 1rem; box-shadow: 0 12px 30px -10px rgba(0,0,0,0.4); font-size: 0.9rem; animation: toastIn 0.3s ease; border-left: 4px solid var(--orange); }
.toast-commande { border-left-color: var(--green); }
.toast-message { border-left-color: var(--blue); }
.toast-out { animation: toastOut 0.4s ease forwards; }
@keyframes toastIn { from { opacity:0; transform: translateX(30px); } to { opacity:1; transform: translateX(0); } }
@keyframes toastOut { to { opacity:0; transform: translateX(30px); } }

/* --- Messagerie --- */
.msg-layout { display: grid; grid-template-columns: 220px 1fr; gap: 1rem; margin-top: 1rem; min-height: 420px; }
.msg-contacts { background: #fff; border-radius: 1.2rem; border: 1px solid #eef2f7; padding: 0.6rem; height: fit-content; box-shadow: 0 8px 20px -10px rgba(15,23,42,0.1); }
.msg-contact { padding: 0.6rem 0.8rem; border-radius: 0.9rem; cursor: pointer; font-weight: 600; color: #334155; display:flex; align-items:center; justify-content:space-between; margin-bottom: 0.2rem; transition: 0.15s; }
.msg-contact:hover { background: #f1f5f9; }
.msg-contact.active { background: linear-gradient(120deg, var(--orange), var(--orange2)); color: white; }
.msg-thread { background: #fff; border-radius: 1.2rem; border: 1px solid #eef2f7; display: flex; flex-direction: column; box-shadow: 0 8px 20px -10px rgba(15,23,42,0.1); overflow: hidden; }
.msg-thread-header { padding: 0.9rem 1.2rem; font-weight: 700; background: #f8fafc; border-bottom: 1px solid #eef2f7; color: var(--navy); }
.msg-thread-body { flex: 1; padding: 1rem 1.2rem; overflow-y: auto; max-height: 340px; display: flex; flex-direction: column; gap: 0.5rem; }
.msg-bubble { max-width: 75%; padding: 0.6rem 0.9rem; border-radius: 1rem; font-size: 0.9rem; }
.msg-bubble.mine { align-self: flex-end; background: linear-gradient(120deg, var(--orange), var(--orange2)); color: white; border-bottom-right-radius: 0.3rem; }
.msg-bubble.theirs { align-self: flex-start; background: #f1f5f9; color: #1e293b; border-bottom-left-radius: 0.3rem; }
.msg-meta { font-size: 0.72rem; opacity: 0.75; margin-bottom: 0.15rem; }
.msg-composer { display: flex; gap: 0.5rem; padding: 0.8rem; border-top: 1px solid #eef2f7; background: #f8fafc; }
.msg-composer input { margin: 0; }
.msg-composer button { margin: 0; white-space: nowrap; }

.emp-row { display:flex; justify-content:space-between; align-items:flex-start; gap:0.6rem; padding:0.6rem 0; border-bottom: 1px dashed #e2e8f0; }
.emp-row code { background: #f1f5f9; padding: 0.1rem 0.5rem; border-radius: 0.5rem; }
.pw-toggle { padding: 0.15rem 0.5rem; font-size: 0.8rem; margin-left: 0.3rem; }

@media (max-width: 700px) {
    .tab-content { padding: 1rem; }
    .nav-btn { padding: 0.5rem 0.8rem; }
    .msg-layout { grid-template-columns: 1fr; }
    .msg-contacts { display: flex; overflow-x: auto; gap: 0.4rem; }
}
</style>
</head>
<body>
<div id="toastContainer"></div>

<div id="loginScreen" style="max-width:450px; margin: 5rem auto; background:white; border-radius:2rem; padding:2rem; box-shadow:0 10px 25px rgba(0,0,0,0.1);">
    <h2 style="text-align:center">🏨 Complexe La Casa Del Shei</h2>
    <p style="text-align:center">Connexion personnel</p>
    <input type="text" id="loginUsername" placeholder="Nom d'utilisateur" style="margin-bottom:0.5rem">
    <input type="password" id="loginPassword" placeholder="Mot de passe">
    <button id="loginBtn" style="width:100%; margin-top:1rem;">Se connecter</button>
    <div id="loginError" style="color:red; text-align:center; margin-top:1rem;"></div>
</div>

<div id="roleSelectScreen" style="display:none; max-width:450px; margin: 5rem auto; background:white; border-radius:2rem; padding:2rem; box-shadow:0 10px 25px rgba(0,0,0,0.1);">
    <h2 style="text-align:center">👤 Choisissez votre rôle</h2>
    <p style="text-align:center; color:#64748b;" id="roleSelectSubtitle"></p>
    <div id="roleSelectButtons" style="display:flex; flex-direction:column; gap:0.6rem;"></div>
    <button id="backToLoginFromRole" style="width:100%; margin-top:1.2rem; background:#64748b;">⬅ Retour</button>
</div>

<div id="mainApp" style="display:none;">
    <div class="app-container">
        <header>
            <h1>🏨 COMPLEXE LA CASA DEL SHEI</h1>
            <div class="user-info">
                <span id="roleDisplay"></span>
                <button id="logoutBtn" class="logout-btn">Déconnexion</button>
            </div>
        </header>
        <nav id="tabNav"></nav>
        <div id="tabContents"></div>
    </div>
</div>

<script>
// ================================================================
// ⚠️ CONFIGURATION — à modifier une fois le backend déployé
// ================================================================
// Remplacez cette URL par celle de votre backend (server.js) une fois déployé
// (Render, Railway, Fly.io, etc.). En local pendant les tests : http://localhost:3000
const API_BASE = window.location.origin; // se connecte toujours au serveur qui héberge cette page, quel que soit le domaine

// ================================================================
// 1. DONNÉES
// ================================================================
let employees = [];        // { id, username, password, role, nom }
let servicesBarber = [];
let coiffeurs = [];
let ventesBarber = [];

let produitsBar = [];       // { id, nom, prix, zone: "bar"|"vip", stock }  -- "bar" = stock PARTAGÉ entre Bar classique et Bar Piscine
let ventesBar = [];         // historique des commandes servies { id, date, numeroTable, emplacement, items, total }

let articlesMarket = [];    // { id, nom, prix, stock, codeBarre }
let ventesMarket = [];

let chambres = [];          // { id, numero, type, prixParNuit, statut: "libre"|"occupee", checkOut }
let reservationsHotel = []; // { id, clientNom, chambreId, dateDebut, dateFin, statut, typeResa }
let servicesHotel = [];
let reservationServices = [];

let comptesTables = [];     // { id, numeroTable, clientNom, emplacement:"bar"|"piscine"|"vip", soldeInitial, solde, dateOuverture, statut:"ouvert"|"ferme" }
let messages = [];          // { id, fromId, fromNom, toId:employeeId|"all", text, date, lu }
let commandes = [];         // { id, compteTableId, numeroTable, emplacement, items:[{produitId,nom,prix,qte}], total, statut:"en_attente"|"en_preparation"|"servi", dateCommande }
let ventesPiscineSessions = []; // { id, date, type:"seul"|"couple"|"groupe", nbPersonnes, prixUnitaire, gratuits, payants, sousTotal, rabaisPourcent, montantRabais, total }

let currentUser = null;
let currentRole = "";
const CATEGORIES_MENU = [
    { key: "jus", label: "🧃 Jus" },
    { key: "nourriture", label: "🍽️ Nourritures" },
    { key: "shot", label: "🥃 Shot" },
    { key: "rhum", label: "🍾 Rhum" },
    { key: "gazeuse", label: "🥤 Gazeuses" }
];
function labelCategorie(key) { return (CATEGORIES_MENU.find(c=>c.key===key)||{}).label || "🍽️ Nourritures"; }
let clientMenuCategorie = "jus";
let dispoRefreshInterval = null;
let gbphActiveKey = null; // mémorise la sous-section active de "Bar/Piscine/Hôtel" pour ne pas revenir au début à chaque rafraîchissement
let tauxChange = 130; // Gourdes (HTG) pour 1 Dollar ($). Modifiable par l'admin.
let fraisServiceVipPourcent = 12; // Majoration (%) appliquée aux produits commandés depuis une table VIP. Modifiable par l'admin.
let prixSeancePiscine = 5;      // Prix d'une séance piscine, PAR PERSONNE ($). Modifiable par l'admin.
let seuilGratuitGroupe = 12;    // Taille de groupe pour 1 personne gratuite (ex: 12 => paient 11, 1 gratuite)
let rabaisGroupePourcent = 0;   // Rabais groupe (%) que l'admin autorise, appliqué au choix par le personnel
let dureeMomentHeures = 2;      // Durée d'un "Moment" en chambre, en heures. Modifiable par l'admin.

const NB_TABLES = 30;

// Formate un montant (stocké en $) en affichant aussi son équivalent en Gourdes
function formatMontant(usd) {
    const g = Math.round(usd * tauxChange);
    return `${usd.toFixed(2)} $ <span style="color:#64748b;font-size:0.85em;">(${g.toLocaleString('fr-FR')} HTG)</span>`;
}
function formatMontantTexte(usd) {
    const g = Math.round(usd * tauxChange);
    return `${usd.toFixed(2)} $ (${g.toLocaleString('fr-FR')} HTG)`;
}

// ================================================================
// 2. CHARGEMENT / SAUVEGARDE
// ================================================================
function loadAllData() {
    return fetch(`${API_BASE}/api/state`)
        .then(async res => {
            if (!res.ok) {
                const body = await res.json().catch(() => ({}));
                throw new Error(body.detail ? ("Erreur serveur (" + res.status + ") : " + body.detail) : ("HTTP " + res.status));
            }
            return res.json();
        })
        .then(d => {
            servicesBarber = d.servicesBarber || [];
            coiffeurs = d.coiffeurs || [];
            ventesBarber = d.ventesBarber || [];
            produitsBar = d.produitsBar || [];
            ventesBar = d.ventesBar || [];
            articlesMarket = d.articlesMarket || [];
            ventesMarket = d.ventesMarket || [];
            chambres = d.chambres || [];
            reservationsHotel = d.reservationsHotel || [];
            servicesHotel = d.servicesHotel || [];
            reservationServices = d.reservationServices || [];
            comptesTables = d.comptesTables || [];
            commandes = d.commandes || [];
            tauxChange = d.tauxChange || 130;
            fraisServiceVipPourcent = (typeof d.fraisServiceVipPourcent === "number") ? d.fraisServiceVipPourcent : 12;
            ventesPiscineSessions = d.ventesPiscineSessions || [];
            prixSeancePiscine = (typeof d.prixSeancePiscine === "number") ? d.prixSeancePiscine : 5;
            seuilGratuitGroupe = d.seuilGratuitGroupe || 12;
            rabaisGroupePourcent = (typeof d.rabaisGroupePourcent === "number") ? d.rabaisGroupePourcent : 0;
            dureeMomentHeures = (typeof d.dureeMomentHeures === "number") ? d.dureeMomentHeures : 2;
            messages = d.messages || [];
        })
        .then(() => fetch(`${API_BASE}/api/employees`))
        .then(res => { if (!res.ok) throw new Error("HTTP " + res.status); return res.json(); })
        .then(emps => { employees = emps || []; })
        .catch(e => { console.error("Erreur de connexion au serveur:", e); throw e; });
}
function saveAllData() {
    const toStore = {
        servicesBarber, coiffeurs, ventesBarber,
        produitsBar, ventesBar,
        articlesMarket, ventesMarket,
        chambres, reservationsHotel, servicesHotel, reservationServices,
        comptesTables, commandes, tauxChange, fraisServiceVipPourcent,
        ventesPiscineSessions, prixSeancePiscine, seuilGratuitGroupe, rabaisGroupePourcent,
        dureeMomentHeures, messages
    };
    // Best-effort : on n'attend pas la réponse pour ne pas bloquer l'interface (comme avant avec localStorage)
    fetch(`${API_BASE}/api/state`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(toStore)
    }).catch(e => console.error("Erreur de sauvegarde vers le serveur:", e));
}
// Recharge les données depuis le serveur (utile pour la synchro entre appareils différents)
function reloadFromStorage() {
    return loadAllData();
}

// ================================================================
// 3. UTILITAIRES
// ================================================================
function printReceipt(title, lines, totalUsd, options) {
    // IMPORTANT: cette fonction ne doit JAMAIS lever d'erreur qui bloquerait le reste du
    // traitement (sauvegarde des données, rafraîchissement de l'écran). L'impression est
    // une opération "best effort" — si elle échoue (popup bloqué, WebView Android sans
    // support window.open, etc.) on l'ignore silencieusement.
    options = options || {};
    try {
        const total = typeof totalUsd === "number" ? totalUsd : parseFloat(totalUsd) || 0;
        const barcodeHtml = options.barcodeValue ? `
            <div style="text-align:center;margin-top:0.8rem;">
                <svg id="barcodeSvg"></svg>
                <div style="font-size:0.7rem;letter-spacing:0.1em;">${options.barcodeValue}</div>
            </div>
            <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"><\/script>
            <script>
                try {
                    JsBarcode("#barcodeSvg", ${JSON.stringify(options.barcodeValue)}, { height: 40, width: 1.6, fontSize: 10, margin: 4 });
                } catch(e) {}
            <\/script>` : "";
        const noteHtml = options.footerNote ? `<p style="text-align:center; font-size:0.78rem; font-weight:bold; margin-top:0.5rem;">${options.footerNote}</p>` : "";
        let content = `<div style="font-family: monospace; width: 280px; margin:0 auto; padding:1rem;">
            <h3 style="text-align:center">🏨 COMPLEXE LA CASA DEL SHEI</h3>
            <p style="text-align:center">${title}</p>
            <hr/>
            ${lines.map(l => `<div>${l}</div>`).join('')}
            <hr/>
            <div style="font-weight:bold">TOTAL : ${formatMontantTexte(total)}</div>
            ${noteHtml}
            ${barcodeHtml}
            <p style="text-align:center; font-size:0.8rem;">${new Date().toLocaleString()}</p>
            </div>`;
        // 1) Pont natif Android éventuel (comme pour l'impression thermique Sunmi)
        if (window.AndroidPrint && typeof window.AndroidPrint.printHtml === "function") {
            window.AndroidPrint.printHtml(content);
            return;
        }
        // 2) Fallback navigateur classique
        let win = window.open();
        if (!win) { console.warn("Impression: fenêtre bloquée par le navigateur"); return; }
        win.document.write(content);
        if (!options.barcodeValue) win.print();
        else setTimeout(() => win.print(), 400); // laisse le temps au code-barres de se dessiner
    } catch (e) {
        console.warn("Impression indisponible sur cet appareil:", e);
    }
}
function tablesDisponibles() {
    const prises = comptesTables.filter(c => c.statut === "ouvert").map(c => c.numeroTable);
    const dispo = [];
    for (let i = 1; i <= NB_TABLES; i++) if (!prises.includes(i)) dispo.push(i);
    return dispo;
}
function formatRemaining(ms) {
    if (ms <= 0) return "Temps écoulé";
    const totalMin = Math.floor(ms / 60000);
    const h = Math.floor(totalMin / 60);
    const m = totalMin % 60;
    return `${h}h ${m}min`;
}
function badgeStatut(s) {
    if (s === "en_attente") return `<span class="badge badge-attente">En attente</span>`;
    if (s === "en_preparation") return `<span class="badge badge-prepa">En préparation</span>`;
    if (s === "servi") return `<span class="badge badge-servi">Servi</span>`;
    return s;
}
function refreshCurrentTab() {
    const activeBtn = document.querySelector(".nav-btn.active");
    if (activeBtn && activeBtn._render) activeBtn._render();

// Met à jour les pastilles de notification sur les onglets (commandes en attente / messages non lus)
function updateNavBadges() {
    document.querySelectorAll(".nav-btn").forEach(btn => {
        const tabId = btn.dataset.tab;
        const badge = btn.querySelector(".nav-badge");
        if (!badge) return;
        let count = 0;
        if (tabId === "messagerie") {
            count = totalMessagesNonLus();
        } else if (tabId === "barCommandes") {
            count = commandes.filter(c => c.emplacement === "vip" && c.statut !== "servi").length;
        }
        if (count > 0) { badge.style.display = "inline-block"; badge.textContent = count > 99 ? "99+" : count; }
        else { badge.style.display = "none"; }
    });
}

function estAujourdhui(valeurDate) {
    if (!valeurDate) return false;
    const d = new Date(valeurDate);
    if (isNaN(d.getTime())) return false;
    const now = new Date();
    return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
}

    <div id="vaContent"></div>`;
    const choixDiv = document.getElementById("vaChoix");
    function afficherChoix() {
        choixDiv.innerHTML = "";
        options.forEach(opt => {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.textContent = opt.label;
            btn.style.background = opt.key === choix ? "#f97316" : "#334155";
            btn.addEventListener("click", () => { choix = opt.key; afficherChoix(); afficherContenu(); });

    afficherChoix();

            <div id="msgThreadHeader" class="msg-thread-header">📢 Canal général (Tous)</div>

            <div class="msg-composer">
                <input id="msgInput" placeholder="Écrire un message...">
                <button id="msgSendBtn" type="button">Envoyer</button>
            </div>
        </div>
    </div>`;
    let contactActif = "all";
    function estContactTable(val) { return typeof val === "string" && val.indexOf("table:") === 0; }
    function idTable(val) { return parseInt(val.split(":")[1]); }
    function nomDe(val) {
        if (val === "all") return "Tous";
        if (estContactTable(val)) {
            const c = comptesTables.find(x => x.id === idTable(val));
            return c ? `Table ${c.numeroTable} — ${c.clientNom}` : "Table fermée";
        }
        const e = employees.find(x => x.id === val);
        return e ? e.nom : "?";
    }
    function messagesDuFil(contactId) {
        if (contactId === "all") return messages.filter(m => m.toId === "all" && !m.tableId);
        if (estContactTable(contactId)) { const tid = idTable(contactId); return messages.filter(m => m.tableId === tid); }
        return messages.filter(m =>
            !m.tableId && ((m.fromId === currentUser.id && m.toId === contactId) || (m.fromId === contactId && m.toId === currentUser.id))
        );
    }
    function nonLusDe(contactId) {
        if (contactId === "all") return messages.filter(m => m.toId==="all" && !m.tableId && m.fromId!==currentUser.id && !(m.luPar||[]).includes(currentUser.id)).length;
        if (estContactTable(contactId)) { const tid = idTable(contactId); return messages.filter(m => m.tableId===tid && m.fromId==="table" && !m.luStaff).length; }
        return messages.filter(m => !m.tableId && m.fromId===contactId && m.toId===currentUser.id && !m.lu).length;
    }
    function refreshContacts() {
        const listDiv = document.getElementById("msgContactsList");
        const nbTous = nonLusDe("all");
        let html = `<div class="msg-contact ${contactActif==='all'?'active':''}" data-contact="all">📢 Tous ${nbTous>0?`<span class="badge-count">${nbTous}</span>`:''}</div>`;
        if (tablesOuvertes.length) {
            html += `<div style="font-size:0.72rem;color:#94a3b8;font-weight:700;margin:0.6rem 0 0.2rem;text-transform:uppercase;">🍽️ Tables</div>`;
            html += tablesOuvertes.map(t => {
                const key = "table:" + t.id;
                const nb = nonLusDe(key);
                return `<div class="msg-contact ${contactActif===key?'active':''}" data-contact="${key}">🍽️ Table ${t.numeroTable} ${nb>0?`<span class="badge-count">${nb}</span>`:''}</div>`;
            }).join('');
            html += `<div style="font-size:0.72rem;color:#94a3b8;font-weight:700;margin:0.6rem 0 0.2rem;text-transform:uppercase;">👥 Employés</div>`;
        }
        html += contacts.map(c => {
            const nb = nonLusDe(c.id);
            return `<div class="msg-contact ${contactActif===c.id?'active':''}" data-contact="${c.id}">${c.nom} ${nb>0?`<span class="badge-count">${nb}</span>`:''}</div>`;
        }).join('');
        listDiv.innerHTML = html;
        listDiv.querySelectorAll("[data-contact]").forEach(el => {
            el.addEventListener("click", () => {
                const val = el.dataset.contact;
                contactActif = (val === "all" || estContactTable(val)) ? val : parseInt(val);
                document.getElementById("msgThreadHeader").textContent = contactActif==="all" ? "📢 Canal général (Tous)" : `💬 ${nomDe(contactActif)}`;
                marquerLu(contactActif);
                refreshThread();
                refreshContacts();
            });
        });
    }
    function marquerLu(contactId) {
        if (contactId === "all") {
            messages.forEach(m => { if(m.toId==="all" && !m.tableId) { m.luPar = m.luPar || []; if(!m.luPar.includes(currentUser.id)) m.luPar.push(currentUser.id); } });
        } else if (estContactTable(contactId)) {
            const tid = idTable(contactId);
            messages.forEach(m => { if(m.tableId===tid && m.fromId==="table") m.luStaff = true; });
        } else {
            messages.forEach(m => { if(!m.tableId && m.fromId===contactId && m.toId===currentUser.id) m.lu = true; });
        }
        saveAllData();
    }
    function refreshThread() {
        const body = document.getElementById("msgThreadBody");
        const fil = messagesDuFil(contactActif).slice().sort((a,b)=>a.id-b.id);
        body.innerHTML = fil.map(m => `
            <div class="msg-bubble ${m.fromId===currentUser.id ? 'mine':'theirs'}">
                <div class="msg-meta">${m.fromNom} · ${m.date}</div>
                <div>${(m.text||"").replace(/</g,"&lt;")}</div>
            </div>
        `).join('') || `<em style="color:#94a3b8;">Aucun message pour l'instant</em>`;
        body.scrollTop = body.scrollHeight;
    }
    document.getElementById("msgSendBtn")?.addEventListener("click", () => {
        const input = document.getElementById("msgInput");
        const text = input.value.trim();
        if(!text) return;
        if (estContactTable(contactActif)) {
            const tid = idTable(contactActif);
            messages.push({ id: Date.now(), tableId: tid, fromId: currentUser.id, fromNom: currentUser.nom, toId: "table", text, date: new Date().toLocaleString(), luStaff: true, luClient: false });
        } else {
            messages.push({ id: Date.now(), fromId: currentUser.id, fromNom: currentUser.nom, toId: contactActif, text, date: new Date().toLocaleString(), lu: false, luPar: contactActif==="all" ? [currentUser.id] : undefined });
        }
        saveAllData();
        input.value = "";
        refreshThread();
        refreshContacts();
    });
    document.getElementById("msgInput")?.addEventListener("keydown", (e) => {
        if (e.key === "Enter") document.getElementById("msgSendBtn").click();
    });
    marquerLu("all");
    refreshContacts();
    refreshThread();
}
function totalMessagesNonLus() {
    if (!currentUser) return 0;
    const directs = messages.filter(m => !m.tableId && m.toId===currentUser.id && !m.lu).length;
    const generaux = messages.filter(m => !m.tableId && m.toId==="all" && m.fromId!==currentUser.id && !(m.luPar||[]).includes(currentUser.id)).length;
    const tablesMsg = messages.filter(m => m.tableId && m.fromId==="table" && !m.luStaff).length;
    return directs + generaux + tablesMsg;
}

        if(listDiv) listDiv.innerHTML = employees.map(e => `<div class="emp-row">
            <div><strong>${e.nom}</strong> — Login: <code>${e.username}</code> — Mot de passe: <code class="pw-hidden" data-pw="${e.username+'_'+e.id}">••••••</code>

        </div>`).join('');

                const id = parseInt(btn.dataset.id);

                try {
                    const res = await fetch(`${API_BASE}/api/employees/${id}`, { method: "DELETE" });
                    if (!res.ok) { alert("Erreur lors de la suppression."); return; }
                    employees = employees.filter(emp => emp.id !== id);
                    refreshList();
                } catch(e) { alert("Impossible de contacter le serveur."); }
            });
        });
        listDiv.querySelectorAll(".pw-toggle").forEach(btn => {
            btn.addEventListener("click", () => {
                const codeEl = listDiv.querySelector(`code[data-pw="${btn.dataset.target}"]`);
                if (!codeEl) return;
                const showing = codeEl.dataset.showing === "1";
                codeEl.textContent = showing ? "••••••" : btn.dataset.pwval;
                codeEl.dataset.showing = showing ? "0" : "1";
                btn.textContent = showing ? "👁️" : "🙈";
            });
        });
    }
    document.getElementById("addEmployee")?.addEventListener("click", async () => {
        const nom = document.getElementById("empNom").value;
        const username = document.getElementById("empUsername").value;
        const password = document.getElementById("empPassword").value;
        const roles = Array.from(document.querySelectorAll(".empRoleCheckbox:checked")).map(cb => cb.value);
        if(!nom || !username || !password) return alert("Remplissez tous les champs");
        if(roles.length === 0) return alert("Cochez au moins un rôle");
        try {
            const res = await fetch(`${API_BASE}/api/employees`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ nom, username, password, roles })
            });
            if (!res.ok) {
                const err = await res.json().catch(()=>({}));
                alert(err.error || "Erreur lors de la création (login déjà pris ?)");
                return;
            }
            const created = await res.json();
            employees.push(created);
            refreshList();
            document.getElementById("empNom").value = "";
            document.getElementById("empUsername").value = "";
            document.getElementById("empPassword").value = "";
            document.querySelectorAll(".empRoleCheckbox").forEach(cb => cb.checked = false);
        } catch(e) { alert("Impossible de contacter le serveur."); }
    });
    refreshList();
}

        const grid = document.getElementById(`roomGrid_${tabId}`);

        grid.innerHTML = chambres.map(c => {
            const libre = c.statut === "libre";
            let sousTitre = "Disponible";
            if (!libre) {
                if (c.checkOut) {
                    const rem = new Date(c.checkOut).getTime() - Date.now();
                    sousTitre = "Reste " + formatRemaining(rem);
                } else {
                    sousTitre = "Occupée";
                }
            }
            return `<div class="room-card ${libre?'libre':'occupee'}">
                <div class="roomnum">${c.numero}</div>
                <div>${c.type}</div>
                <div style="margin-top:0.4rem; font-size:0.85rem;">${sousTitre}</div>
            </div>`;
        }).join('');
    }
    paint();
    clearInterval(dispoRefreshInterval);
    dispoRefreshInterval = setInterval(paint, 15000);
}

function renderSiteWeb(tabId) {
    const container = document.getElementById(tabId);
    if (!container) return;
    container.innerHTML = `<div class="summary">🌐 Demandes envoyées depuis le site web de l'hôtel</div>
    <div class="card-grid">
        <div class="card"><h3>📅 Demandes de réservation</h3><div id="siteResaList">Chargement...</div></div>
        <div class="card"><h3>✉️ Messages de contact</h3><div id="siteMsgList">Chargement...</div></div>
    </div>`;
    async function refresh() {
        try {
            const [resaRes, msgRes] = await Promise.all([
                fetch(`${API_BASE}/api/site-reservation-requests`),
                fetch(`${API_BASE}/api/site-messages`)
            ]);
            const resas = await resaRes.json();
            const msgs = await msgRes.json();
            document.getElementById("siteResaList").innerHTML = resas.length ? resas.map(r => `
                <div style="border-bottom:1px dashed #e2e8f0;padding:0.6rem 0;">
                    <strong>${r.nom}</strong> ${r.statut === "nouvelle" ? '<span class="badge badge-attente">Nouvelle</span>' : '<span class="badge badge-servi">Traitée</span>'}<br>
                    <span style="color:#64748b;font-size:0.85rem;">📞 ${r.telephone || "-"}${r.email ? " · ✉️ "+r.email : ""}</span><br>
                    <span style="color:#64748b;font-size:0.85rem;">${r.type_reservation || "-"} · Arrivée: ${r.date_arrivee || "-"} · Départ: ${r.date_depart || "-"}</span><br>
                    ${r.message ? `<em>"${r.message}"</em><br>` : ""}
                    <span style="font-size:0.75rem;color:#94a3b8;">${new Date(r.created_at).toLocaleString()}</span>
                    ${r.statut === "nouvelle" ? `<button data-traiter="${r.id}">✔ Marquer traitée</button>` : ""}
                </div>
            `).join('') : "<em>Aucune demande pour l'instant</em>";
            document.getElementById("siteMsgList").innerHTML = msgs.length ? msgs.map(m => `
                <div style="border-bottom:1px dashed #e2e8f0;padding:0.6rem 0;">
                    <strong>${m.nom}</strong> ${!m.lu ? '<span class="badge badge-attente">Non lu</span>' : ''}<br>
                    ${m.contact ? `<span style="color:#64748b;font-size:0.85rem;">📞 ${m.contact}</span><br>` : ""}
                    ${m.message}<br>
                    <span style="font-size:0.75rem;color:#94a3b8;">${new Date(m.created_at).toLocaleString()}</span>
                    ${!m.lu ? `<button data-lu="${m.id}">✔ Marquer lu</button>` : ""}
                </div>
            `).join('') : "<em>Aucun message pour l'instant</em>";

            container.querySelectorAll("[data-traiter]").forEach(btn => {
                btn.addEventListener("click", async () => {
                    await fetch(`${API_BASE}/api/site-reservation-requests/${btn.dataset.traiter}`, {
                        method: "PATCH", headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ statut: "traitee" })
                    });
                    refresh();
                });
            });
            container.querySelectorAll("[data-lu]").forEach(btn => {
                btn.addEventListener("click", async () => {
                    await fetch(`${API_BASE}/api/site-messages/${btn.dataset.lu}`, {
                        method: "PATCH", headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ lu: true })
                    });
                    refresh();
                });
            });
        } catch (e) {
            document.getElementById("siteResaList").innerHTML = `<em style='color:#dc2626;'>Connexion au serveur impossible : ${e.message}</em>`;
            document.getElementById("siteMsgList").innerHTML = `<em style='color:#dc2626;'>Connexion au serveur impossible : ${e.message}</em>`;
        }
    }
    refresh();
}

function renderHotelResa(tabId) {
    tabId = tabId || "hotelResa";
    const container = document.getElementById(tabId);
    if(!container) return;
    const dureeLabels = { moment: "Moment (2h)", nuit: "Nuit(s)", semaine: "Semaine(s)", mois: "Mois" };
    container.innerHTML = `<div class="summary">🏨 Réservations — préciser le nombre de personnes et la durée du séjour (moment de 2h, nuit(s), semaine(s) ou mois, comme sur un Airbnb)</div>
    <div id="resaErrorMsg" style="color:#dc2626;font-weight:600;"></div>
    <div class="card-grid"><div class="card"><h3>➕ Nouvelle réservation (check-in immédiat)</h3>
    <input id="resaClient" placeholder="Nom du client">
    <select id="resaChambre"></select>
    <label style="font-size:0.8rem;color:#64748b;">Nombre de personnes</label>
    <input id="resaPersonnes" type="number" min="1" value="1">
    <label style="font-size:0.8rem;color:#64748b;">Type de séjour</label>
    <select id="resaTypeDuree">
        <option value="moment">Moment (2h)</option>
        <option value="nuit" selected>Nuit(s)</option>
        <option value="semaine">Semaine(s)</option>
        <option value="mois">Mois</option>
    </select>
    <div id="resaQuantiteWrap">
        <label style="font-size:0.8rem;color:#64748b;" id="resaQuantiteLabel">Nombre de nuits</label>
        <input id="resaQuantite" type="number" min="1" value="1">
    </div>
    <select id="resaType"><option value="presentiel">Présentiel</option><option value="enligne">En ligne</option></select>
    <div id="resaRecap" class="summary" style="margin-top:0.6rem;"></div>
    <button id="btnReserver" type="button">Réserver & attribuer</button>
    </div>
    <div class="card"><h3>📅 Réservations actives</h3><div id="listResaHotel"></div></div></div>`;

    function chambreSelectionnee() {
        const id = parseInt(document.getElementById("resaChambre").value);
        return chambres.find(c => c.id === id);
    }
    function calculerSejour() {
        const type = document.getElementById("resaTypeDuree").value;
        let qte = parseInt(document.getElementById("resaQuantite").value);
        if (isNaN(qte) || qte < 1) qte = 1;
        const ch = chambreSelectionnee();
        const tarifs = { moment: ch?.prixMoment, nuit: ch?.prixParNuit, semaine: ch?.prixSemaine, mois: ch?.prixMois };
        const montant = ch ? (tarifs[type] || 0) * qte : 0;
        const heuresParUnite = { moment: dureeMomentHeures, nuit: 24, semaine: 24*7, mois: 24*30 };
        const dateDebut = new Date();
        const dateFin = new Date(dateDebut.getTime() + qte * heuresParUnite[type] * 3600 * 1000);
        return { type, qte, montant, dateDebut, dateFin };
    }
    function refreshRecap() {
        document.getElementById("resaQuantiteLabel").textContent = "Nombre de " + { moment: `moments (${dureeMomentHeures}h chacun)`, nuit: "nuits", semaine: "semaines", mois: "mois" }[document.getElementById("resaTypeDuree").value];
        const s = calculerSejour();
        document.getElementById("resaRecap").innerHTML = `Départ prévu : <strong>${s.dateFin.toLocaleString()}</strong><br>Total à payer : <strong>${formatMontant(s.montant)}</strong>`;
    }
    document.getElementById("resaTypeDuree")?.addEventListener("change", refreshRecap);
    document.getElementById("resaQuantite")?.addEventListener("input", refreshRecap);
    document.getElementById("resaChambre")?.addEventListener("change", refreshRecap);

    function refresh() {
        const selectChambre = document.getElementById("resaChambre");
        const zoneSelection = selectChambre ? selectChambre.value : null;
        if(selectChambre) selectChambre.innerHTML = chambres.map(c => `<option value="${c.id}" ${c.statut !== "libre" ? "disabled" : ""}>${c.numero} - ${c.type}${c.statut!=="libre"?" [occupée]":""}</option>`).join('');
        const listDiv = document.getElementById("listResaHotel");
        if(listDiv) listDiv.innerHTML = reservationsHotel.slice().reverse().map(r => {
            const ch = chambres.find(c=>c.id===r.chambreId);
            const rem = ch && ch.checkOut ? formatRemaining(new Date(ch.checkOut).getTime()-Date.now()) : "-";
            return `<div><strong>${r.clientNom}</strong> (${r.nombrePersonnes||1} pers.) - Chambre ${ch?.numero||'?'} - ${r.quantiteDuree||1} ${dureeLabels[r.typeDuree]||''} - ${r.typeResa} - ${formatMontant(r.montant||0)}<br>Départ: ${new Date(r.dateFin).toLocaleString()} - ${rem}</div>`;
        }).join('');
        refreshRecap();
    }
    document.getElementById("btnReserver")?.addEventListener("click", () => {
        const errDiv = document.getElementById("resaErrorMsg");
        errDiv.textContent = "";
        const client = document.getElementById("resaClient").value.trim();
        const chambreId = parseInt(document.getElementById("resaChambre").value);
        const nombrePersonnes = parseInt(document.getElementById("resaPersonnes").value) || 1;
        const typeResa = document.getElementById("resaType").value;
        const chambre = chambres.find(c=>c.id===chambreId);
        if(!client) { errDiv.textContent = "⚠️ Le nom du client est requis."; return; }
        if(!chambre || chambre.statut !== "libre") { errDiv.textContent = "⚠️ Chambre non disponible."; return; }
        const s = calculerSejour();
        chambre.statut = "occupee";
        chambre.checkOut = s.dateFin.toISOString();
        reservationsHotel.push({
            id: Date.now(), clientNom: client, chambreId, nombrePersonnes,
            typeDuree: s.type, quantiteDuree: s.qte, montant: s.montant,
            dateDebut: s.dateDebut.toISOString(), dateFin: s.dateFin.toISOString(),
            statut: "en_cours", typeResa
        });
        saveAllData();
        document.getElementById("resaClient").value = "";
        document.getElementById("resaPersonnes").value = "1";
        document.getElementById("resaQuantite").value = "1";
        refresh();
        printReceipt("Réservation Hôtel", [`Client: ${client}`, `Chambre: ${chambre.numero}`, `Personnes: ${nombrePersonnes}`, `Durée: ${s.qte} ${dureeLabels[s.type]}`, `Départ prévu: ${s.dateFin.toLocaleString()}`], s.montant);
    });
    refresh();
}

function renderComptesTables(tabId, emplacementsAutorises) {
    const container = document.getElementById(tabId);
    if(!container) return;
    const emplacementLabels = { bar: "Bar", piscine: "Bar Piscine", vip: "VIP" };
    const toutesZones = ["bar", "piscine", "vip"];
    // emplacementsAutorises peut être : undefined (toutes les zones, ex. admin), une chaîne (zone unique verrouillée,
    // ex. Piscine), ou un tableau de zones sélectionnables (ex. ["bar","vip"] pour le rôle Bar qui gère aussi le VIP)
    const zoneUnique = typeof emplacementsAutorises === "string" ? emplacementsAutorises : null;
    const zonesSelectionnables = Array.isArray(emplacementsAutorises) ? emplacementsAutorises : toutesZones;
    const zonesFiltre = zoneUnique ? [zoneUnique] : zonesSelectionnables;
    container.innerHTML = `<div class="summary">💳 Ouverture d'un compte table : le client dépose un montant (en $ ou en HTG), une table lui est attribuée. Il voit ensuite son solde et commande depuis la tablette posée sur la table. Taux du jour : <strong>1 $ = ${tauxChange} HTG</strong></div>
    <div id="ctErrorMsg" style="color:#dc2626; font-weight:600;"></div>
    <div class="card-grid">
    <div class="card"><h3>➕ Ouvrir un compte / attribuer une table</h3>
    <input id="ctClient" placeholder="Nom du client">
    <div style="display:flex; gap:0.4rem;">
        <input id="ctMontant" type="number" step="0.01" placeholder="Montant du dépôt" style="flex:2;">
        <select id="ctDevise" style="flex:1;"><option value="usd">$</option><option value="htg">HTG</option></select>
    </div>
    <div id="ctEquivalent" style="font-size:0.85rem;color:#64748b;"></div>
    ${zoneUnique
        ? `<input type="hidden" id="ctEmplacement" value="${zoneUnique}"><div style="font-weight:600;">Zone : ${emplacementLabels[zoneUnique]}</div>`
        : `<select id="ctEmplacement">${zonesSelectionnables.map(z=>`<option value="${z}">${emplacementLabels[z]}</option>`).join('')}</select>`}
    <label style="font-size:0.8rem;color:#64748b;">Table attribuée automatiquement</label>
    <div id="ctNextTable" style="font-weight:700;"></div>
    <button id="ctOuvrir" type="button">Ouvrir le compte & imprimer</button>
    </div>
    <div class="card"><h3>📋 Comptes ouverts${zoneUnique ? " — " + emplacementLabels[zoneUnique] : ""}</h3><div id="ctList"></div></div>
    </div>
    <div class="card" style="margin-top:1.5rem;">
        <h3>🍽️ Tables disponibles</h3>
        <div id="ctTablesGrid" class="room-grid"></div>
    </div>`;
    function nextTable() { const d = tablesDisponibles(); return d.length ? d[0] : null; }
    function genererCodeAcces() {
        const codesUtilises = new Set(comptesTables.filter(c=>c.statut==="ouvert").map(c=>c.codeAcces));
        let code;
        do { code = String(Math.floor(1000 + Math.random()*9000)); } while (codesUtilises.has(code));
        return code;
    }
    function updateEquivalent() {
        const val = parseFloat(document.getElementById("ctMontant").value);
        const dev = document.getElementById("ctDevise").value;
        const eqDiv = document.getElementById("ctEquivalent");
        if (isNaN(val)) { eqDiv.textContent = ""; return; }
        if (dev === "usd") eqDiv.textContent = `≈ ${Math.round(val*tauxChange).toLocaleString('fr-FR')} HTG`;
        else eqDiv.textContent = `≈ ${(val/tauxChange).toFixed(2)} $`;
    }
    document.getElementById("ctMontant")?.addEventListener("input", updateEquivalent);
    document.getElementById("ctDevise")?.addEventListener("change", updateEquivalent);
    function refresh() {
        document.getElementById("ctNextTable").textContent = nextTable() ? "Table n° " + nextTable() : "⚠️ Aucune table disponible";
        const listDiv = document.getElementById("ctList");
        const comptesAffiches = comptesTables.filter(c=>c.statut==="ouvert" && zonesFiltre.includes(c.emplacement));
        if(listDiv) listDiv.innerHTML = comptesAffiches.slice().reverse().map(c => `<div><strong>Table ${c.numeroTable}</strong> - ${c.clientNom} (${emplacementLabels[c.emplacement]||c.emplacement}) - Solde: ${formatMontant(c.solde)} - Code: <code>${c.codeAcces||"—"}</code> <button class="danger-btn" data-close="${c.id}">Clôturer</button></div>`).join('') || "<em>Aucun compte ouvert</em>";
        listDiv.querySelectorAll("[data-close]").forEach(btn => {
            btn.addEventListener("click", () => {
                const id = parseInt(btn.dataset.close);
                const c = comptesTables.find(x=>x.id===id);
                if(c && confirm(`Clôturer le compte de la table ${c.numeroTable} ? Solde restant: ${formatMontantTexte(c.solde)}`)) {
                    c.statut = "ferme";
                    saveAllData(); refresh();
                }
            });
        });
        const grid = document.getElementById("ctTablesGrid");
        if (grid) {
            const occupeesToutesZones = comptesTables.filter(c=>c.statut==="ouvert");
            let html = "";
            for (let i = 1; i <= NB_TABLES; i++) {
                const occ = occupeesToutesZones.find(c => c.numeroTable === i);
                if (occ) {
                    html += `<div class="room-card occupee"><div class="roomnum">${i}</div><div style="font-size:0.8rem;">${emplacementLabels[occ.emplacement]||occ.emplacement}<br>${occ.clientNom}</div></div>`;
                } else {
                    html += `<div class="room-card libre"><div class="roomnum">${i}</div><div style="font-size:0.8rem;">Disponible</div></div>`;
                }
            }
            grid.innerHTML = html;
        }
    }
    document.getElementById("ctOuvrir")?.addEventListener("click", () => {
        const errDiv = document.getElementById("ctErrorMsg");
        errDiv.textContent = "";
        const client = document.getElementById("ctClient").value.trim();
        const saisie = parseFloat(document.getElementById("ctMontant").value);
        const devise = document.getElementById("ctDevise").value;
        const emplacement = document.getElementById("ctEmplacement").value;
        const num = nextTable();
        if(!client) { errDiv.textContent = "⚠️ Le nom du client est requis."; return; }
        if(isNaN(saisie) || saisie<=0) { errDiv.textContent = "⚠️ Montant du dépôt invalide."; return; }
        if(!num) { errDiv.textContent = "⚠️ Plus aucune table disponible."; return; }
        const montantUsd = devise === "htg" ? (saisie / tauxChange) : saisie;
        const codeAcces = genererCodeAcces();
        const compte = { id: Date.now(), numeroTable: num, clientNom: client, emplacement, soldeInitial: montantUsd, solde: montantUsd, dateOuverture: new Date().toLocaleString(), statut: "ouvert", codeAcces };
        comptesTables.push(compte);
        saveAllData();
        // On vide le formulaire et on rafraîchit la liste AVANT l'impression : même si
        // l'impression échoue sur cet appareil, le compte est bien créé et visible.
        document.getElementById("ctClient").value = "";
        document.getElementById("ctMontant").value = "";
        document.getElementById("ctEquivalent").textContent = "";
        refresh();
        printReceipt("Ouverture compte table", [`Client: ${client}`, `Zone: ${emplacementLabels[emplacement]}`, `Dépôt: ${formatMontantTexte(montantUsd)}`, `CODE D'ACCÈS TABLETTE: ${codeAcces}`, `Table attribuée: n°${num}`], montantUsd);
        alert(`Compte ouvert — Table ${num}\nCode d'accès à donner au client : ${codeAcces}`);
    });
    refresh();
}

function renderVenteDirecte(tabId, zone, zoneLabel) {
    const container = document.getElementById(tabId);
    if (!container) return;
    let panier = [];
    container.innerHTML = `<div class="summary">🧾 Vente directe ${zoneLabel} — le client commande au comptoir ou auprès d'une serveuse, paiement immédiat, pas de compte ni de code d'accès.</div>
    <div class="card-grid">
        <div class="card"><h3>🍹 Menu ${zoneLabel}</h3><div id="vdMenu_${tabId}"></div></div>
        <div class="card"><h3>🧾 Commande en cours</h3><div id="vdCart_${tabId}"></div>
            <button id="vdEncaisser_${tabId}" class="print-receipt" style="width:100%;">Encaisser</button>
        </div>
    </div>
    <div class="card" style="margin-top:1.5rem;"><h3>📜 Ventes récentes</h3><div id="vdHistorique_${tabId}"></div></div>`;

    function refreshMenu() {
        const produits = produitsBar.filter(p => p.zone === "bar" && p.stock > 0);
        const parCategorie = {};
        produits.forEach(p => { const c = p.categorie || "autre"; (parCategorie[c] = parCategorie[c]||[]).push(p); });
        document.getElementById(`vdMenu_${tabId}`).innerHTML = Object.keys(parCategorie).map(cat => `
            <div style="font-size:0.75rem;color:#94a3b8;font-weight:700;text-transform:uppercase;margin:0.6rem 0 0.2rem;">${cat}</div>
            ${parCategorie[cat].map(p => `
                <div class="qty-stepper"><span style="flex:1;">${p.nom} - ${formatMontant(p.prix)}</span>
                <button type="button" data-vd-minus="${p.id}">-</button><span id="vdQty_${tabId}_${p.id}">0</span><button type="button" data-vd-plus="${p.id}">+</button></div>
            `).join('')}
        `).join('') || "<em>Aucun produit disponible</em>";
        document.querySelectorAll(`#vdMenu_${tabId} [data-vd-plus]`).forEach(btn => {
            btn.addEventListener("click", () => {
                const id = parseInt(btn.dataset.vdPlus);
                const p = produits.find(x=>x.id===id);
                let item = panier.find(i=>i.produitId===id);
                const dejaEnPanier = item ? item.qte : 0;
                if (dejaEnPanier >= p.stock) return;
                if (!item) { item = { produitId: id, nom: p.nom, prix: p.prix, qte: 0 }; panier.push(item); }
                item.qte++;
                document.getElementById(`vdQty_${tabId}_${id}`).textContent = item.qte;
                refreshCart();
            });
        });
        document.querySelectorAll(`#vdMenu_${tabId} [data-vd-minus]`).forEach(btn => {
            btn.addEventListener("click", () => {
                const id = parseInt(btn.dataset.vdMinus);
                let item = panier.find(i=>i.produitId===id);
                if (!item) return;
                item.qte--;
                document.getElementById(`vdQty_${tabId}_${id}`).textContent = Math.max(0, item.qte);
                if (item.qte <= 0) panier = panier.filter(i=>i.produitId!==id);
                refreshCart();
            });
        });
    }
    function refreshCart() {
        const cartDiv = document.getElementById(`vdCart_${tabId}`);
        const total = panier.reduce((s,i)=>s+i.prix*i.qte,0);
        cartDiv.innerHTML = panier.length ? (panier.map(i=>`${i.nom} x${i.qte} = ${formatMontant(i.prix*i.qte)}`).join("<br>") + `<br><strong>Total: ${formatMontant(total)}</strong>`) : "<em>Aucun article sélectionné</em>";
        document.getElementById(`vdEncaisser_${tabId}`).disabled = panier.length === 0;
    }
    function refreshHistorique() {
        const ventes = ventesBar.filter(v => v.emplacement === zone).slice(-8).reverse();
        document.getElementById(`vdHistorique_${tabId}`).innerHTML = ventes.map(v => `${v.date} — ${v.items.map(i=>`${i.nom} x${i.qte}`).join(', ')} — ${formatMontant(parseFloat(v.total))}`).join("<hr>") || "<em>Aucune vente</em>";
    }
    document.getElementById(`vdEncaisser_${tabId}`)?.addEventListener("click", () => {
        if (panier.length === 0) return;
        for (const item of panier) {
            const p = produitsBar.find(x=>x.id===item.produitId);
            if (!p || p.stock < item.qte) { alert("Stock insuffisant pour " + item.nom); return; }
        }
        const total = panier.reduce((s,i)=>s+i.prix*i.qte,0);
        panier.forEach(item => { const p = produitsBar.find(x=>x.id===item.produitId); p.stock -= item.qte; });
        const idVente = Date.now();
        ventesBar.push({ id: idVente, date: new Date().toLocaleString(), numeroTable: "-", emplacement: zone, items: panier.map(i=>({...i})), total: total.toFixed(2) });
        saveAllData();
        printReceipt(`Vente directe ${zoneLabel}`, panier.map(i=>`${i.nom} x${i.qte} = ${formatMontant(i.prix*i.qte)}`), total, {
            barcodeValue: "V" + idVente,
            footerNote: "MENU NORMAL — sans supplément VIP"
        });
        panier = [];
        refreshMenu(); refreshCart(); refreshHistorique();
    });
    refreshMenu(); refreshCart(); refreshHistorique();
}

                }

    refresh();

function calculerSeancePiscine(type, nbPersonnes) {
    const prixUnitaire = prixSeancePiscine;
    let gratuits = 0;
    if (type === "groupe" && nbPersonnes >= seuilGratuitGroupe) {
        gratuits = Math.floor(nbPersonnes / seuilGratuitGroupe);
    }
    const payants = Math.max(0, nbPersonnes - gratuits);
    const sousTotal = payants * prixUnitaire;
    return { prixUnitaire, gratuits, payants, sousTotal };
}

function renderVentePiscineSession(tabId) {
    tabId = tabId || "piscineSessions";

    container.innerHTML = `<div class="summary">🏊 Vente d'une séance piscine — facturée par personne (${formatMontantTexte(prixSeancePiscine)}/pers). Pour un groupe : 1 personne gratuite toutes les ${seuilGratuitGroupe} personnes.</div>

        if (type === "seul") return 1;
        if (type === "couple") return 2;
        const n = parseInt(document.getElementById("pscNbGroupe").value);
        return isNaN(n) || n < 1 ? 0 : n;
    }
    function refreshCalcul() {
        const type = document.getElementById("pscType").value;
        document.getElementById("pscNbGroupeWrap").style.display = type === "groupe" ? "block" : "none";
        document.getElementById("pscRabaisWrap").style.display = (type === "groupe" && rabaisGroupePourcent > 0) ? "block" : "none";
        const nb = nbPersonnesActuel();
        const calc = calculerSeancePiscine(type, nb);
        const appliquerRabais = type === "groupe" && document.getElementById("pscAppliquerRabais")?.checked;
        const montantRabais = appliquerRabais ? calc.sousTotal * (rabaisGroupePourcent/100) : 0;
        const total = calc.sousTotal - montantRabais;
        let html = `Personnes: ${nb} — Payantes: ${calc.payants}`;
        if (calc.gratuits > 0) html += ` — <strong style="color:#16a34a;">Gratuites: ${calc.gratuits} 🎁</strong>`;
        html += `<br>Sous-total: ${formatMontant(calc.sousTotal)}`;
        if (appliquerRabais) html += `<br>Rabais groupe (${rabaisGroupePourcent}%): -${formatMontant(montantRabais)}`;
        html += `<br><strong>Total à payer: ${formatMontant(total)}</strong>`;
        document.getElementById("pscDetailCalcul").innerHTML = html;
    }
    document.getElementById("pscType")?.addEventListener("change", refreshCalcul);
    document.getElementById("pscNbGroupe")?.addEventListener("input", refreshCalcul);
    document.getElementById("pscAppliquerRabais")?.addEventListener("change", refreshCalcul);

    function refreshHistorique() {
        const hist = document.getElementById("pscHistorique");
        hist.innerHTML = ventesPiscineSessions.slice(-8).reverse().map(v => `
            <div>${v.date} — ${v.type} (${v.nbPersonnes} pers., ${v.gratuits} gratuite${v.gratuits>1?'s':''}) ${v.clientNom?('- '+v.clientNom):''} — <strong>${formatMontant(v.total)}</strong></div>
        `).join('') || "<em>Aucune séance enregistrée</em>";
    }
    document.getElementById("pscEncaisser")?.addEventListener("click", () => {
        const type = document.getElementById("pscType").value;
        const nb = nbPersonnesActuel();
        if (nb < 1) { alert("Nombre de personnes invalide."); return; }
        const calc = calculerSeancePiscine(type, nb);
        const appliquerRabais = type === "groupe" && document.getElementById("pscAppliquerRabais")?.checked;
        const montantRabais = appliquerRabais ? calc.sousTotal * (rabaisGroupePourcent/100) : 0;
        const total = calc.sousTotal - montantRabais;
        const clientNom = document.getElementById("pscClientNom").value.trim();
        const vente = { id: Date.now(), date: new Date().toLocaleString(), type, nbPersonnes: nb, prixUnitaire: calc.prixUnitaire, gratuits: calc.gratuits, payants: calc.payants, sousTotal: calc.sousTotal, rabaisPourcent: appliquerRabais ? rabaisGroupePourcent : 0, montantRabais, total, clientNom };
        ventesPiscineSessions.push(vente);
        saveAllData();
        document.getElementById("pscClientNom").value = "";
        document.getElementById("pscType").value = "seul";
        refreshCalcul();
        refreshHistorique();
        const lignes = [
            `Type: ${type}`,
            `Personnes: ${nb} (payantes: ${calc.payants}, gratuites: ${calc.gratuits})`
        ];
        if (appliquerRabais) lignes.push(`Rabais groupe: ${rabaisGroupePourcent}%`);
        if (clientNom) lignes.push(`Client: ${clientNom}`);
        printReceipt("Séance Piscine", lignes, total);
    });

    refreshCalcul();
    refreshHistorique();
}

let marketScanner = null;
let marketCartRef = [];
function stopMarketScanner() {
    if(marketScanner) {
        marketScanner.stop().then(()=>marketScanner.clear()).catch(()=>{});
        marketScanner = null;
    }
}
function renderMarketVente() {
    const container = document.getElementById("marketVente");
    if(!container) return;
    container.innerHTML = `<div class="summary">🛒 Scannez les articles avec la caméra, comme en caisse</div>
    <div class="card-grid">
        <div class="card"><h3>📷 Scanner un article</h3>
            <button id="startScan">Démarrer la caméra</button>
            <button id="stopScan" class="danger-btn">Arrêter</button>
            <div id="reader"></div>
            <div id="scanFeedback"></div>
        </div>
        <div class="card"><h3>🔎 Recherche manuelle</h3>
            <input id="searchProduct" placeholder="Nom ou code-barre">
            <button id="searchBtn">Rechercher</button>
            <select id="productList" size="5"></select>
            <input id="marketQty" type="number" value="1">
            <button id="addToCart">Ajouter au panier</button>
        </div>
        <div class="card"><h3>🧾 Panier</h3><div id="cartItems"></div><button id="payMarket">Payer</button><button id="printMarketTicket" class="print-receipt">Imprimer ticket</button></div>
        <div class="card"><h3>Ventes récentes</h3><div id="marketRecentVentes"></div></div>
    </div>`;
    marketCartRef = [];

    function refreshCart() {
        const cartDiv = document.getElementById("cartItems");
        if(cartDiv) cartDiv.innerHTML = marketCartRef.map(item=>`${item.nom} x${item.qte} = ${(item.prix*item.qte).toFixed(2)} $`).join("<br>") + (marketCartRef.length ? `<br><strong>Total: ${formatMontant(marketCartRef.reduce((s,i)=>s+(i.prix*i.qte),0))}</strong>` : "<em>Panier vide</em>");
    }
    function refreshProductList(filter="") {
        const list = document.getElementById("productList");
        if(!list) return;
        let filtered = articlesMarket.filter(a => a.nom.toLowerCase().includes(filter.toLowerCase()) || a.codeBarre.includes(filter));
        list.innerHTML = filtered.map(a => `<option value="${a.id}">${a.nom} - ${a.prix.toFixed(2)} $ (stock:${a.stock})</option>`).join('');
    }
    function addArticleToCart(article, qte) {
        if(!article || article.stock < qte) { document.getElementById("scanFeedback").innerHTML = `<span style="color:red;">Stock insuffisant pour ${article?article.nom:'cet article'}</span>`; return; }
        const exist = marketCartRef.find(c=>c.articleId===article.id);
        if(exist) exist.qte += qte; else marketCartRef.push({ articleId: article.id, nom: article.nom, prix: article.prix, qte });
        refreshCart();
    }
    document.getElementById("startScan")?.addEventListener("click", () => {
        stopMarketScanner();
        marketScanner = new Html5Qrcode("reader");
        marketScanner.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: 220 },
            (decodedText) => {
                const article = articlesMarket.find(a => a.codeBarre === decodedText.trim());
                if(article) {
                    addArticleToCart(article, 1);
                    document.getElementById("scanFeedback").innerHTML = `<span style="color:green;">✔ ${article.nom} ajouté</span>`;
                } else {
                    document.getElementById("scanFeedback").innerHTML = `<span style="color:red;">Code inconnu: ${decodedText}</span>`;
                }
            },
            () => {}
        ).catch(err => {
            document.getElementById("scanFeedback").innerHTML = `<span style="color:red;">Caméra indisponible: ${err}</span>`;
        });
    });
    document.getElementById("stopScan")?.addEventListener("click", stopMarketScanner);
    document.getElementById("searchBtn")?.addEventListener("click", () => refreshProductList(document.getElementById("searchProduct").value));
    document.getElementById("addToCart")?.addEventListener("click", () => {
        const artId = parseInt(document.getElementById("productList").value);
        const qte = parseInt(document.getElementById("marketQty").value) || 1;
        addArticleToCart(articlesMarket.find(a=>a.id===artId), qte);
    });
    document.getElementById("payMarket")?.addEventListener("click", () => {
        if(marketCartRef.length===0) return;
        let total = 0;
        for(let item of marketCartRef) {
            const article = articlesMarket.find(a=>a.id===item.articleId);
            if(article && article.stock >= item.qte) {
                article.stock -= item.qte;
                total += item.prix * item.qte;
                ventesMarket.unshift({ id: Date.now(), date: new Date().toLocaleString(), article: article.nom, qte: item.qte, total: (item.prix*item.qte).toFixed(2) });
            }
        }
        saveAllData();
        printReceipt("Ticket Market", marketCartRef.map(i=>`${i.nom} x${i.qte} = ${(i.prix*i.qte).toFixed(2)} $`), total);
        marketCartRef = [];
        refreshCart();
        document.getElementById("marketRecentVentes").innerHTML = ventesMarket.slice(0,5).map(v=>`${v.date} : ${v.article} x${v.qte} = ${formatMontant(parseFloat(v.total))}`).join("<hr>");
    });
    document.getElementById("printMarketTicket")?.addEventListener("click", () => {
        if(marketCartRef.length===0) return alert("Panier vide");
        const lines = marketCartRef.map(i=>`${i.nom} x${i.qte} = ${(i.prix*i.qte).toFixed(2)} $`);
        const total = marketCartRef.reduce((s,i)=>s+(i.prix*i.qte),0).toFixed(2);
        printReceipt("Ticket Market", lines, total);
    });
    document.getElementById("marketRecentVentes").innerHTML = ventesMarket.slice(0,5).map(v=>`${v.date} : ${v.article} x${v.qte} = ${formatMontant(parseFloat(v.total))}`).join("<hr>");
    refreshProductList("");
    refreshCart();
}

document.getElementById("loginBtn")?.addEventListener("click", async () => {
    const username = document.getElementById("loginUsername").value;
    const password = document.getElementById("loginPassword").value;
    const errDiv = document.getElementById("loginError");
    errDiv.innerText = "";
    if (!username || !password) { errDiv.innerText = "Renseignez le login et le mot de passe."; return; }
    let emp;
    try {
        const res = await fetch(`${API_BASE}/api/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password })
        });
        if (!res.ok) {
            if (res.status === 401) { errDiv.innerText = "Identifiants incorrects"; }
            else {
                const errBody = await res.json().catch(() => ({}));
                errDiv.innerText = "Erreur serveur (" + res.status + ")" + (errBody.detail ? " : " + errBody.detail : "");
            }
            return;
        }
        emp = await res.json();
    } catch(e) {
        errDiv.innerText = "Impossible de contacter le serveur. Vérifiez la connexion.";
        return;
    }
    const roles = emp.roles || [];
    if (roles.length === 0) {
        errDiv.innerText = "Ce compte n'a aucun rôle attribué. Contactez l'admin.";
    } else if (roles.length === 1) {
        await entrerDansApp(emp, roles[0]);
    } else {
        // Plusieurs rôles : on laisse l'employé choisir avec quel rôle se connecter
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("roleSelectScreen").style.display = "block";
        document.getElementById("roleSelectSubtitle").textContent = `${emp.nom}, avec quel rôle voulez-vous vous connecter ?`;
        const btnsDiv = document.getElementById("roleSelectButtons");
        btnsDiv.innerHTML = "";
        roles.forEach(r => {
            const b = document.createElement("button");
            b.textContent = roleLabels[r] || r;
            b.addEventListener("click", () => entrerDansApp(emp, r));
            btnsDiv.appendChild(b);
        });
    }
});
document.getElementById("backToLoginFromRole")?.addEventListener("click", () => {
    document.getElementById("roleSelectScreen").style.display = "none";
    document.getElementById("loginScreen").style.display = "block";
});
document.getElementById("logoutBtn")?.addEventListener("click", () => {
    stopMarketScanner();
    clearInterval(dispoRefreshInterval);
    gbphActiveKey = null;
    currentRole = "";
    document.getElementById("mainApp").style.display = "none";
    document.getElementById("loginScreen").style.display = "block";
    document.getElementById("loginUsername").value = "";
    document.getElementById("loginPassword").value = "";
    document.getElementById("loginError").innerText = "";
});

// ================================================================
// NOTIFICATIONS (toast + son) — nouvelles commandes / nouveaux messages
// ================================================================
let ordresVus = new Set();
let messagesVus = new Set();
function initialiserNotifications() {
    ordresVus = new Set(commandes.map(c => c.id));
    messagesVus = new Set(messages.map(m => m.id));
}
function jouerBip() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
        osc.start(); osc.stop(ctx.currentTime + 0.4);
    } catch(e) { /* audio indisponible, on ignore */ }
}
function showToast(text, type) {
    const cont = document.getElementById("toastContainer");
    if (!cont) return;
    const el = document.createElement("div");
    el.className = "toast" + (type ? " toast-" + type : "");
    el.textContent = text;
    cont.appendChild(el);
    jouerBip();
    setTimeout(() => { el.classList.add("toast-out"); setTimeout(() => el.remove(), 400); }, 5000);
}
function verifierNotifications() {
    if (!currentRole) return;
    if (currentUser && currentRole === "bar") {
        const nouvelles = commandes.filter(c => c.emplacement === "vip" && !ordresVus.has(c.id));
        nouvelles.forEach(c => {
            ordresVus.add(c.id);
            showToast(`🔔 Nouvelle commande — Table ${c.numeroTable} (${c.total.toFixed(2)} $)`, "commande");
        });
    }
    if (currentUser) {
        const nouveauxMsgs = messages.filter(m => !m.tableId && m.fromId !== currentUser.id && !messagesVus.has(m.id) && (m.toId === currentUser.id || m.toId === "all"));
        nouveauxMsgs.forEach(m => {
            messagesVus.add(m.id);
            showToast(`💬 ${m.fromNom} : ${m.text}`, "message");
        });
        // Messages envoyés par un client depuis sa tablette vers l'équipe (VIP uniquement désormais)
        if (currentRole === "bar" || currentRole === "admin") {
            const zonesVues = currentRole === "bar" ? ["vip"] : null; // null = toutes zones (admin voit tout)
            const nouveauxTableMsgs = messages.filter(m => {
                if (!m.tableId || m.fromId !== "table" || messagesVus.has(m.id)) return false;
                if (!zonesVues) return true;
                const compte = comptesTables.find(c => c.id === m.tableId);
                return compte && zonesVues.includes(compte.emplacement);
            });
            nouveauxTableMsgs.forEach(m => {
                messagesVus.add(m.id);
                showToast(`🍽️ ${m.fromNom} : ${m.text}`, "message");
            });
        }
    }
    if (currentUser) updateNavBadges();
}

// Ne synchronise/rafraîchit automatiquement QUE si l'utilisateur n'est pas en train
// de taper dans un champ — sinon on efface ce qu'il est en train d'écrire.
function estEnTrainDeSaisir() {
    const el = document.activeElement;
    if (!el) return false;
    const tag = el.tagName;
    return tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT";
}
setInterval(async () => {
    if (!currentRole) return;
    try {
        await reloadFromStorage();
    } catch(e) { return; } // Serveur momentanément injoignable : on réessaiera au prochain cycle
    verifierNotifications();
    if (estEnTrainDeSaisir()) return;
    refreshCurrentTab();
}, 4000);
</script>
